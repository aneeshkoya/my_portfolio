name: Validate Static Site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: pwsh
        run: |
          $required = @(
            "index.html",
            "about.html",
            "experience.html",
            "projects.html",
            "research.html",
            "leadership.html",
            "resume.html",
            "contact.html",
            "styles.css",
            "script.js"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

      - name: Check for accidental secrets
        shell: pwsh
        run: |
          if (Get-ChildItem -Recurse -File -Force | Where-Object { $_.Name -match "^\.env$|^\.env\.local$" }) {
            throw "Environment files must not be committed."
          }
